# HTML缓存控制映射
map $request_filename $html_cache_control {
    ~*\.(html|htm)$ "private, no-cache, no-store, must-revalidate, proxy-revalidate";
    default "";
}

map $request_filename $html_pragma {
    ~*\.(html|htm)$ "no-cache";
    default "";
}

map $request_filename $html_expires {
    ~*\.(html|htm)$ "0";
    default "";
}


server {
    listen 80;
    # 设置相对url重定向
    absolute_redirect off;
    client_max_body_size 20m;
    gzip on;
    server_name_in_redirect on;
    port_in_redirect off;
    gzip_types text/plain text/css application/javascript image/*;

     # 为HTML文件设置缓存头
    add_header Cache-Control $html_cache_control always;
    add_header Pragma $html_pragma always;
    add_header Expires $html_expires always;
    
    location / {
        index index.html;
        try_files $uri $uri/ /index.html;

        # 替换 html 中的 </head> 标签，添加脚本
        ; sub_filter '<head>' '<head><script>window._SIDEBAR_DOMAIN_=""</script>';
        ; sub_filter_once on;
        ; sub_filter_types text/html;
        
        root /alidata1/admin/projects/portal;
    }
    location ^~ /gmp-strategy {
        # hm-gmp-strategy-ui 项目
