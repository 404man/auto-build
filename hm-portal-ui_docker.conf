# HTML缓存控制映射
map $request_filename $html_cache_control {
    ~*\.(html|htm)$ "private, no-cache, no-store, must-revalidate, proxy-revalidate";
    default "";
}

map $request_filename $html_pragma {
    ~*\.(html|htm)$ "no-cache";
    default "";
}

map $request_filename $html_expires {
    ~*\.(html|htm)$ "0";
    default "";
}

server {
  server_tokens  off; #隐藏nginx版本号
  include /etc/nginx/conf.d/*.variable;

  listen       8080;
  client_max_body_size   400m;
  client_header_timeout    10m;
  client_body_timeout      10m;
  proxy_connect_timeout     10m;
  proxy_read_timeout      10m;
  proxy_send_timeout      10m;

  server_name_in_redirect on;
  port_in_redirect off;

  # 为HTML文件设置缓存头
  add_header Cache-Control $html_cache_control always;
  add_header Pragma $html_pragma always;
  add_header Expires $html_expires always;

  gzip on;
  gzip_min_length 1k;
  gzip_buffers 4 32k;
  gzip_comp_level 4;
  gzip_types text/plain application/javascript application/x-javascript text/javascript text/xml text/css;
  gzip_vary on;
  gzip_disable "MSIE [1-6]\.";

  add_header X-Frame-Options ALLOWALL;
  root /usr/share/nginx/html;
  location / {
    index index.html;
    try_files $uri $uri/ /index.html;
  }

  location /health {
    add_header Content-Type text/plain;
    return 200 "up";
  }

  location /getEnv {
    add_header Content-Type application/json;
    return 200 '{"status":"success", "value":"$DEPLOY_ENV"}';
  }

  location ^~ /xflow {
    # rewrite ^/xflow/(.*)$ /$1 break;
    proxy_pass ${XFLOW_SERVER_URL};
  }

  location ^~ /metadata-xflow {
    proxy_pass ${METADATA_XFLOW_SERVER_URL};
  }

  location /api/ {
      proxy_set_header Host $proxy_host;
      proxy_set_header originalDomain $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      rewrite "^/api/(.*)$" /$1 break;
      proxy_pass ${API_SERVER_URL};
  }

}
